name: breaking_native_assets_example
description: Native-assets dependency regression example for xcross.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Working with strings, dates, and numbers
  intl: ^0.20.2

  # formatting
  flutter_quill: ^11.5.1

  # data persist
  drift: ^2.31.0
  drift_flutter: 0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  web: ^1.1.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  # DI
  get_it: ^9.2.1
  # provider: ^6.1.5+1

  # Working with file
  file_picker: ^12.0.0
  # open_filex: ^4.7.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  http: ^1.6.0

  # BLoC pattern
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  uuid: ^4.5.3
  # Reactive state management.
  # riverpod: ^3.2.1
  # riverpod_annotation: ^4.0.2

  # Notifications and Time
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.4.6
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.4.2

  # aws
  amplify_flutter: ^2.15.0
  amplify_auth_cognito: ^2.15.0
  amplify_api: ^2.15.0
  amplify_storage_s3: ^2.15.0

  web_socket_channel: ^3.0.3

  flutter_svg: ^2.3.0
  # for android version getting
  device_info_plus: ^13.2.0
  # surfing the net
  dio: ^5.9.2

dev_dependencies:
  drift_dev: ^2.31.0
  build_runner: ^2.13.1
  # riverpod_generator: ^4.0.3
  # custom_lint: ^0.8.1
  # riverpod_lint: ^3.1.3

  flutter_launcher_icons: ^0.14.4

  mocktail: ^1.0.5

  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0

  flutter_lints: ^6.0.0

flutter:
  # to generate localizations code
  generate: true

  uses-material-design: true
